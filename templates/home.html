    <!-- Client-side dynamic time-aware greetings -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const greetingText = document.getElementById("greeting-text");
            const hour = new Date().getHours();
            let greetStr = "浣犲ソ";
            let emoji = "馃憢";

            if (hour >= 5 && hour < 12) {
                greetStr = "鏃╀笂濂?;
                emoji = "馃寘";
            } else if (hour >= 12 && hour < 14) {
                greetStr = "涓崍濂?;
                emoji = "鈽€锔?;
            } else if (hour >= 14 && hour < 18) {
                greetStr = "涓嬪崍濂?;
                emoji = "馃寚";
            } else {
                greetStr = "鏅氫笂濂?;
                emoji = "馃寵";
            }

            if (greetingText) {
                greetingText.innerHTML = `${greetStr}锛寋{ username }}锛?<span class="greeting-icon" id="greeting-emoji">${emoji}</span>`;
            }

            // Mouse cursor glowing ambient effect coordinates tracker
            const root = document.documentElement;
            window.addEventListener("pointermove", function (e) {
                root.style.setProperty("--cursor-x", e.clientX + "px");
                root.style.setProperty("--cursor-y", e.clientY + "px");
            }, { passive: true });
        });
