services:
  - type: web
    name: toursim-system
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host 0.0.0.0 --port $PORT app:app
    disk:
      name: toursim-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: DB_NAME
        value: tourism.db
      - key: UPLOAD_DATA_DIR
        value: /var/data/uploads
